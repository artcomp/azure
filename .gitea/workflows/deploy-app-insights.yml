name: Deploy App Insights + Log Analytics (Bicep)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nome da aplicacao (a-z, 0-9, hifens; 2-41 chars)"
        required: true
        type: string
      environment:
        description: "Ambiente"
        required: true
        type: choice
        options:
          - dev
          - homolog
          - prod
      region:
        description: "Regiao Azure"
        required: true
        type: choice
        options:
          - eastus
          - eastus2
          - brazilsouth
      dry_run:
        description: "Simular (what-if, sem alterar recursos)"
        required: false
        type: boolean
        default: false

concurrency:
  group: app-insights-${{ inputs.environment }}-${{ inputs.app_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: artcomp/azure-cli-node:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Azure (service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validar inputs, derivar nomes e proximo NNN
        id: names
        uses: ./projects/app-insights/actions/resolve-appi-names
        with:
          app_name: ${{ inputs.app_name }}
          environment: ${{ inputs.environment }}
          region: ${{ inputs.region }}

      - name: Deploy Bicep (subscription scope)
        id: deploy
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: ${{ inputs.dry_run == 'true' && 'whatIf' || 'create' }}
          scope: subscription
          location: ${{ inputs.region }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          name: deploy-${{ steps.names.outputs.appi_name }}
          template-file: projects/app-insights/bicep/deploy.bicep
          parameters: '{"rgName": "${{ steps.names.outputs.rg_name }}", "location": "${{ inputs.region }}", "appiName": "${{ steps.names.outputs.appi_name }}", "logName": "${{ steps.names.outputs.log_name }}"}'
          masked-outputs: connectionString

      - name: Resumo
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REGION: ${{ inputs.region }}
          DRY_RUN: ${{ inputs.dry_run }}
          RG_NAME: ${{ steps.names.outputs.rg_name }}
          APPI_NAME: ${{ steps.names.outputs.appi_name }}
          LOG_NAME: ${{ steps.names.outputs.log_name }}
        run: |
          set -uo pipefail
          if [ "$DRY_RUN" = "true" ]; then modo="what-if (simulacao)"; else modo="create (real)"; fi
          {
            echo "## Deploy Log Analytics + App Insights"
            echo ""
            echo "| Campo | Valor |"
            echo "| --- | --- |"
            echo "| Ambiente | ${ENVIRONMENT:-n/a} |"
            echo "| Regiao | ${REGION:-n/a} |"
            echo "| Modo | $modo |"
            echo "| Resource Group | ${RG_NAME:-n/a} |"
            echo "| Log Analytics | ${LOG_NAME:-n/a} |"
            echo "| App Insights | ${APPI_NAME:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
