name: Deploy App Insights (Bicep)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nome da aplicacao (a-z, 0-9, hifens; 2-41 chars)"
        required: true
        type: string
      environment:
        description: "Ambiente"
        required: true
        type: choice
        options:
          - dev
          - homolog
          - prod
      region:
        description: "Regiao Azure"
        required: true
        type: choice
        options:
          - eastus
          - eastus2
          - brazilsouth

concurrency:
  group: appi-${{ inputs.environment }}-${{ inputs.app_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/azure-cli:latest
    defaults:
      run:
        shell: bash
    outputs:
      rg_name: ${{ steps.names.outputs.rg_name }}
      appi_name: ${{ steps.counter.outputs.appi_name }}
    steps:
      - name: Validar inputs e derivar nomes
        id: names
        env:
          APP_NAME_RAW: ${{ inputs.app_name }}
          ENVIRONMENT: ${{ inputs.environment }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail

          # Normaliza para lowercase e valida formato
          app_name="$(echo "$APP_NAME_RAW" | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$app_name" =~ ^[a-z0-9][a-z0-9-]{1,40}$ ]]; then
            echo "::error::app_name invalido: '$APP_NAME_RAW'. Use apenas a-z, 0-9 e hifens (2-41 chars)."
            exit 1
          fi

          case "$ENVIRONMENT" in
            dev|homolog|prod) ;;
            *) echo "::error::environment invalido: $ENVIRONMENT"; exit 1 ;;
          esac
          case "$REGION" in
            eastus|eastus2|brazilsouth) ;;
            *) echo "::error::region invalida: $REGION"; exit 1 ;;
          esac

          rg_name="${ENVIRONMENT}-rg-${app_name}"
          appi_prefix="${ENVIRONMENT}-appi-${app_name}-${REGION}-"

          {
            echo "rg_name=$rg_name"
            echo "appi_prefix=$appi_prefix"
            echo "app_name=$app_name"
          } >> "$GITHUB_OUTPUT"

          echo "RG: $rg_name | Prefixo App Insights: $appi_prefix"

      - name: Login Azure (service principal)
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_CLIENT_ID:-}" ] || [ -z "${AZURE_CLIENT_SECRET:-}" ] || \
             [ -z "${AZURE_TENANT_ID:-}" ] || [ -z "${AZURE_SUBSCRIPTION_ID:-}" ]; then
            echo "::error::Configure os secrets AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID e AZURE_SUBSCRIPTION_ID no repo Gitea."
            exit 1
          fi
          az login --service-principal \
            -u "$AZURE_CLIENT_ID" \
            -p "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          echo "Logado. Subscription: $(az account show --query name -o tsv)"

      - name: Garantir Resource Group
        env:
          RG_NAME: ${{ steps.names.outputs.rg_name }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          exists="$(az group exists --name "$RG_NAME")"
          if [ "$exists" = "true" ]; then
            echo "Resource Group '$RG_NAME' ja existe. Nada a fazer."
          else
            echo "Resource Group '$RG_NAME' nao encontrado. Criando em $REGION..."
            az group create \
              --name "$RG_NAME" \
              --location "$REGION" \
              --output none
            echo "Resource Group '$RG_NAME' criado."
          fi

      - name: Calcular proximo contador (max+1)
        id: counter
        env:
          RG_NAME: ${{ steps.names.outputs.rg_name }}
          APPI_PREFIX: ${{ steps.names.outputs.appi_prefix }}
        run: |
          set -euo pipefail
          existing="$(az resource list \
            --resource-group "$RG_NAME" \
            --resource-type "Microsoft.Insights/components" \
            --query "[].name" \
            --output tsv)"

          max=0
          for name in $existing; do
            if [[ "$name" =~ ^${APPI_PREFIX}([0-9]{3})$ ]]; then
              n=$((10#${BASH_REMATCH[1]}))
              if [ "$n" -gt "$max" ]; then
                max=$n
              fi
            fi
          done

          next=$((max + 1))
          if [ "$next" -gt 999 ]; then
            echo "::error::Contador estourou 999 para o prefixo '$APPI_PREFIX'. Renomeie/limpe recursos antigos."
            exit 1
          fi

          appi_name="$(printf '%s%03d' "$APPI_PREFIX" "$next")"
          echo "appi_name=$appi_name" >> "$GITHUB_OUTPUT"
          echo "Proximo nome: $appi_name (max atual: $max)"

      - name: Gerar template Bicep
        run: |
          set -euo pipefail
          mkdir -p infra
          cat > infra/main.bicep <<'BICEP_EOF'
          param name string
          param location string

          resource appInsights 'Microsoft.Insights/components@2020-02-02' = {
            name: name
            location: location
            kind: 'web'
            properties: {
              Application_Type: 'web'
            }
          }

          output name string = appInsights.name
          output connectionString string = appInsights.properties.ConnectionString
          BICEP_EOF
          echo "Template gerado:"
          cat infra/main.bicep

      - name: Deploy App Insights via Bicep
        id: deploy
        env:
          RG_NAME: ${{ steps.names.outputs.rg_name }}
          APPI_NAME: ${{ steps.counter.outputs.appi_name }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          az bicep install --output none
          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file infra/main.bicep \
            --parameters name="$APPI_NAME" location="$REGION" \
            --name "appi-deploy-${APPI_NAME}" \
            --output none
          echo "Deploy concluido: $APPI_NAME no RG $RG_NAME ($REGION)"

      - name: Resumo
        if: always()
        env:
          RG_NAME: ${{ steps.names.outputs.rg_name }}
          APPI_NAME: ${{ steps.counter.outputs.appi_name }}
          REGION: ${{ inputs.region }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -uo pipefail
          {
            echo "## Deploy App Insights"
            echo ""
            echo "| Campo | Valor |"
            echo "| --- | --- |"
            echo "| Ambiente | ${ENVIRONMENT:-n/a} |"
            echo "| Regiao | ${REGION:-n/a} |"
            echo "| Resource Group | ${RG_NAME:-n/a} |"
            echo "| App Insights | ${APPI_NAME:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
